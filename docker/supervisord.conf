[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ProcessPriceAlertsJob implements ShouldQueue + QUEUE_CONNECTION=database
[program:queue]
command=/usr/local/bin/php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --backoff=5 --max-time=3600
user=www-data
directory=/var/www/html
autostart=true
autorestart=true
stopwaitsecs=60
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Laravel 11+ long-running scheduler (no system cron in Coolify containers)
[program:scheduler]
command=/usr/local/bin/php /var/www/html/artisan schedule:work
user=www-data
directory=/var/www/html
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
